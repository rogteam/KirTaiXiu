name: Build and publish release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag đã tồn tại cần tạo release, ví dụ v1.0.2'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    name: Test, build and release
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # Khi chạy thủ công, build main hiện tại để có workflow và cấu hình build mới.
          # Khi push tag, build đúng source tại tag đó.
          ref: ${{ github.event_name == 'workflow_dispatch' && github.sha || github.ref }}

      - name: Verify tag, main ancestry and version
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --tags --force
          git rev-parse "refs/tags/${RELEASE_TAG}" >/dev/null

          tag_commit="$(git rev-list -n 1 "${RELEASE_TAG}")"
          if ! git merge-base --is-ancestor "${tag_commit}" "origin/main"; then
            echo "Tag ${RELEASE_TAG} không thuộc lịch sử branch main." >&2
            exit 1
          fi

          version="$(sed -nE "s/^version = '([^']+)'/\1/p" build.gradle)"
          expected_tag="v${version}"
          if [[ "${RELEASE_TAG}" != "${expected_tag}" ]]; then
            echo "Tag ${RELEASE_TAG} không khớp version ${version} trong build.gradle." >&2
            exit 1
          fi

          echo "PLUGIN_VERSION=${version}" >> "${GITHUB_ENV}"
          echo "JAR_PATH=build/libs/KirTaiXiu-${version}.jar" >> "${GITHUB_ENV}"

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Test and build
        run: ./gradlew clean test build --no-daemon

      - name: Verify release artifact
        shell: bash
        run: |
          set -euo pipefail
          test -f "${JAR_PATH}"
          sha256sum "${JAR_PATH}"

      - name: Create GitHub Release and upload JAR
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create "${RELEASE_TAG}" "${JAR_PATH}" \
            --repo "${GITHUB_REPOSITORY}" \
            --verify-tag \
            --generate-notes \
            --title "KirTaiXiu ${PLUGIN_VERSION}"
